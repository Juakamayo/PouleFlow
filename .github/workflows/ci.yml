name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Generar cliente Prisma
        run: npm run prisma:generate --workspace=@pouleflow/backend

      - name: Build backend
        run: npm run build --workspace=@pouleflow/backend

      - name: Build frontend
        run: npm run build --workspace=@pouleflow/frontend
